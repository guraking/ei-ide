plan.fullunknown.fix=WHERE · 조인에 쓴 칼럼에 인덱스가 있는지 확인하세요. 있다면 그 칼럼에 함수나 형 변환이 씌워지지 않았는지 보세요.
plan.fullunused.title={0} 전체 읽기 (인덱스 {1} 안 씀)
plan.fullunused.cause=조건 칼럼으로 시작하는 인덱스 {1}({2})가 있는데도 표 전체를 읽습니다.
plan.fullunused.fix=조건 칼럼에 함수 · 형 변환이 씌워졌는지 아래 지적을 보세요. 그런 것이 없으면 걸러지는 건수가 많아 DB 가 전체 읽기가 싸다고 본 것입니다. 통계가 오래됐으면 다시 모으세요.
plan.fullnoindex.title={0} 전체 읽기 (인덱스 없음)
