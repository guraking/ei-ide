plan.time.fix=이 단계의 다른 지적과 조건을 먼저 보세요. 읽은 블록이 많으면 읽는 범위를 줄이는 것이 답입니다.
plan.cost.title=비용의 {0,number,#}% 가 여기
plan.cost.cause=예상 비용의 {0,number,#}% 가 이 단계에 몰려 있습니다.
plan.cost.fix=이 단계의 조건(오른쪽 아래)을 보고, 읽는 건수를 줄일 조건이나 인덱스를 찾으세요.
plan.estimate.title=예상 건수가 실제와 크게 다름
plan.estimate.cause=예상 {0,number} 건, 실제 {1,number} 건입니다. 통계가 오래되어 DB 가 잘못된 방법을 골랐을 수 있습니다.
plan.estimate.fix=표 통계를 다시 모으세요. 운영 DB 는 DBA 와 상의하세요.
plan.fn.date.title={0} 에 {1} 를 씌움
plan.fn.date.cause=날짜 칼럼 {0} 를 {1} 로 바꾼 뒤 비교해서 {0} 인덱스를 쓰지 못합니다.
plan.fn.date.fix=칼럼은 그대로 두고 값 쪽을 날짜 범위로 바꾸세요.
plan.fn.convert.title={0} 형 변환 ({1})
plan.fn.convert.cause=칼럼 {0} 와 비교하는 값의 형이 달라 DB 가 칼럼 쪽을 바꿉니다. 그래서 {0} 인덱스를 쓰지 못합니다.
plan.fn.convert.fix=값을 칼럼과 같은 형으로 넘기세요. 문자 칼럼이면 따옴표 붙은 문자로, MyBatis 는 jdbcType 이나 자바 형을 칼럼에 맞추세요.
plan.fn.nvl.title={0} 에 {1} 를 씌움
plan.fn.nvl.cause={1}({0}, …) 처럼 칼럼을 감싸서 {0} 인덱스를 쓰지 못합니다.
plan.fn.nvl.fix=값이 없는 경우를 OR 로 풀어 쓰세요. 매퍼라면 <if> 로 조건 자체를 빼는 것이 더 빠릅니다.
plan.fn.case.title={0} 에 {1} 를 씌움
plan.fn.case.cause=대소문자를 맞추려고 칼럼을 바꿔서 {0} 인덱스를 쓰지 못합니다.
plan.fn.case.fix=저장할 때 대소문자를 맞춰 두고 값 쪽만 바꾸거나, 아래처럼 함수 기반 인덱스를 만드세요.
plan.fn.substr.title={0} 에 {1} 를 씌움
