plan.subquery.fix=IN · NOT IN 서브쿼리는 EXISTS · NOT EXISTS 로, 스칼라 서브쿼리는 조인으로 바꾸고, 서브쿼리가 바깥과 잇는 칼럼에 인덱스를 두세요.
