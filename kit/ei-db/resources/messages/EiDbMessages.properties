plan.fn.substr.fix=앞부분 비교는 LIKE 앞부분% 로 바꾸면 인덱스를 씁니다.
plan.fn.other.title={0} 에 {1} 를 씌움
plan.fn.other.cause=칼럼을 함수로 감싸 비교해서 {0} 인덱스를 쓰지 못합니다.
plan.fn.other.fix=함수는 값 쪽으로 옮기세요. 옮길 수 없으면 함수 기반 인덱스를 검토하세요.
