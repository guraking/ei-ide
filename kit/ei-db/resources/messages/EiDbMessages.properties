plan.fullnoindex.fix=자주 쓰는 조회라면 아래 인덱스를 만드세요. = 조건 칼럼을 앞에 둡니다. 운영 DB 는 DBA 와 상의하세요.
plan.indexfull.title={0} 인덱스 전체 읽기
plan.indexfull.cause=인덱스를 처음부터 끝까지 다 읽습니다. 표 전체 읽기보다는 낫지만 건수가 많으면 느립니다.
plan.indexfull.fix=인덱스의 첫 칼럼에 조건을 주면 필요한 범위만 읽습니다.
plan.skip.title={0} 인덱스 건너뛰며 읽기
plan.skip.cause=인덱스 첫 칼럼에 조건이 없어 첫 칼럼 값마다 따로 찾습니다.
plan.skip.fix=인덱스 첫 칼럼 조건을 넣거나, 지금 조건 칼럼으로 시작하는 인덱스를 만드세요.
plan.sort.title=큰 정렬 · 묶기
plan.sort.cause={0,number} 건을 정렬하거나 묶습니다(ORDER BY · GROUP BY · DISTINCT · UNION). 메모리를 넘으면 디스크에 씁니다.
plan.sort.fix=필요 없는 ORDER BY · DISTINCT 를 빼고, UNION 은 겹침 제거가 필요 없으면 UNION ALL 로 바꾸세요. 정렬 칼럼 순서의 인덱스가 있으면 정렬을 건너뜁니다.
plan.subquery.title=행마다 서브쿼리 반복
