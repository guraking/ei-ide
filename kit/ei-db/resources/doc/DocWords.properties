# 「주석 만들기」 기본 사전. 이름을 낱말로 쪼갠 뒤(소문자) 이 표로 한국어로 바꾼다. 없는 낱말은 영어 그대로 둔다.
# type.<형식>  매개변수 · 돌려주는 형식의 단순 이름 → 설명
# verb.<낱말>  메서드 이름 첫 낱말 → 동사(「~한다」 앞부분)
# word.<낱말>  그 밖의 낱말 → 한국어. 빈 값이면 그 낱말을 뺀다(Vo · Dto 같은 꼬리).
# 사용자는 설정(도구 → 주석 만들기)의 사전 칸에서 같은 꼴로 더하거나 덮어쓴다.

