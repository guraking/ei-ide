rmerge.warn=주황 {0,number,#}개: 내가 고친 파일을 다른 사람이 고쳤습니다. 충돌이 나지 않아도 내 작업이 바뀔 수 있으니 두 번 눌러 비교해 보세요.
rmerge.hint=파일을 두 번 누르면 비교
