# 오류 · 확인 · 알림 · 진행 · 안내 글. IDE 언어와 상관없이 항상 이 한국어 글이 나온다(SyncBundle.message 가 먼저 찾는다).
history.loading=기록을 읽는 중…
history.legend.dot=● 꽉 찬 점: 보통 커밋. 같은 칸의 곧은 선은 바로 아래 커밋에 이어집니다.
history.legend.merge.dot=○ 속이 빈 점 · 흐린 글자: 합치기(Merge) 커밋입니다.
history.legend.split=위쪽에서 점으로 꺾여 들어오는 선: 이 커밋에서 새 가지가 갈라져 나갔거나, 위쪽 합치기 커밋이 이 커밋을 합쳐 갔습니다.
history.legend.merge=점에서 아래쪽으로 꺾여 나가는 선: 다른 가지의 커밋을 이 커밋으로 합쳤습니다.
history.legend.passing=점 없이 곧게 지나가는 선: 이 줄과 상관없는 다른 가지가 아래 커밋으로 이어지는 길입니다.
history.legend.color=선 색은 나란히 가는 가지 줄을 구분할 뿐, 브랜치 종류와는 상관없습니다.
history.legend.hover=커밋을 고르면 위쪽 줄에 그 커밋의 꺾인 선이 어느 커밋과 이어지는지 보입니다.
history.graph.straight=꺾인 선 없이 바로 아래 커밋에 곧게 이어진 보통 커밋입니다.
sync.revert.confirm=아래 파일의 내 변경을 지우고 마지막 커밋 상태로 되돌립니다. 되돌린 변경은 복구할 수 없습니다.
sync.revert.skipped=새로 추가 · 이름 바꿈 · 복사한 파일 {0,number,#}개는 지우지 않도록 뺐습니다. 그 파일은 「스테이징만 풀기」를 쓰세요.
sync.revert.done={0,number,#}개 파일을 되돌렸습니다.
sync.unstage.done={0,number,#}개 파일의 스테이징을 풀었습니다. 파일은 그대로 남아 있습니다.
sync.unassume.done={0,number,#}개 파일의 Assume Unchanged 를 풀었습니다. 내 변경이 다시 보입니다.
sync.svn.updating={0}: svn update 중…
sync.svn.updated={0}: {1,number,#}개 저장소를 최신으로 받았습니다.
sync.action.missing={0} 동작을 찾을 수 없습니다({1}).
