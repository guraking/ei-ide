rmerge.in.progress=끝나지 않은 머지 · cherry-pick · revert · rebase 가 있어({0}) 새로 머지하지 않았습니다. 먼저 충돌을 풀어 커밋하거나 Git 메뉴에서 취소(Abort)한 뒤 다시 하세요.
rmerge.untracked=Git 에 추가하지 않은 새 파일이 머지해 올 파일과 이름이 같아 머지하지 않았습니다. git 은 이 파일을 덮어쓰지 않습니다. 아래 파일을 다른 곳으로 옮기거나 지운 뒤 다시 하세요.\n\n{0}
rmerge.push.rejected.finish=그사이 다른 사람이 서버의 {0} 에 먼저 올려 Push 가 거절됐고, 서버의 새 커밋을 받아 머지하다 멈췄습니다. 충돌을 풀어 마무리한 머지는 내 PC 의 {1} 에 그대로 있습니다. {1} 브랜치에서 Git → Pull 로 받은 뒤 Git → Push 로 올리세요.
