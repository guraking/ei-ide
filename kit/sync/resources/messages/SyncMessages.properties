rmerge.case=머지해 올 쪽에서 파일 이름의 대소문자만 바뀐 파일이 {0,number,#}개 있어 머지하지 않았습니다.
rmerge.case.ask={0} 에서 아래 파일 이름의 대소문자만 바뀌었습니다. 윈도우는 대소문자만 다른 이름을 같은 파일로 봐서, 그대로 합치면 git 이 「추적 안 된 파일을 덮어쓴다(untracked working tree files would be overwritten)」며 멈춥니다.\n\n{1}\n\n{2} 에서 이름을 먼저 맞춰 커밋한 뒤 머지할까요? 머지가 실패하거나 Push 가 거절되면 이름 맞춤 커밋도 되돌립니다.
