rmerge.conflict={0} → {1} 합치기에서 충돌이 났습니다. 이어서 뜨는 충돌 창에서 모두 해결하면 합치기 커밋과 푸시를 이어서 합니다.
rmerge.conflict.left=충돌이 남아 있거나 합치기를 취소해 마무리하지 않았습니다. 지금 브랜치는 {0} 입니다. 남은 충돌은 Resolve Conflicts 로 해결한 뒤 커밋 · 푸시하세요.
rmerge.finishing={0} → {1} 합치기 마무리 중…
rmerge.dirty=커밋하지 않은 변경이 있어 합치지 않았습니다. 커밋하거나 Shelve 한 뒤 다시 하세요. 그대로 합치다 충돌이 나 취소하면 그 변경을 되살리지 못할 수 있습니다.
rmerge.dirty.ask=커밋하지 않은 변경이 있습니다. 변경을 잠시 Stash 해 두고 합친 뒤 되살릴까요?\n충돌이 나면 충돌을 해결해 합치기를 마무리한 뒤 되살립니다.
rmerge.stash.kept=커밋하지 않은 변경은 Stash 에 넣어 두었습니다. 합치기를 마무리하면 되살립니다.
rmerge.stash.left=커밋하지 않은 변경은 아직 Stash 에 있습니다. 합치기를 마무리한 뒤 Git → Uncommitted Changes → Unstash Changes 로 되살리세요.
rmerge.unstash.failed=합치기는 끝났지만 Stash 에 넣어 둔 변경을 되살리지 못했습니다. Stash 는 그대로 있으니 Git → Uncommitted Changes → Unstash Changes 로 되살리세요.
rmerge.push.failed=합치기는 내 PC 의 {0} 에 들어갔지만 서버로 올리지 못했습니다. 원인을 해결한 뒤 Merge Branches 를 다시 하면 올립니다.
rmerge.unpushed.into=Push 하면 내 PC 의 {0} 에만 있던 커밋 {1,number,#}개도 같이 올라갑니다.
rmerge.done={0} 을(를) {1} 에 합쳤습니다. 아직 푸시하지 않았습니다.
rmerge.done.pushed={0} 을(를) {1} 에 합치고 {2}/{1} 로 푸시했습니다.
rmerge.note={0} 보다 {1,number,#}개 뒤
