close.repo.dependents=다음 모듈이 닫을 리포지토리를 씁니다: {0}\n닫으면 Maven 을 다시 읽어 그 모듈들이 로컬 Maven 리포지토리의 jar 를 쓰게 하는데, 아래 것은 jar 로 바꿀 수 없습니다(로컬 리포지토리에 jar 가 없거나 Maven 모듈이 아님).\n{1}\n\njar 가 회사 Maven 서버에 있으면 다시 읽을 때 받아 오지만, 그렇지 않으면 그 모듈들에서 컴파일 오류가 납니다.\n먼저 닫을 리포지토리에서 mvn install 을 해 두면 안전합니다. 그래도 닫을까요?
