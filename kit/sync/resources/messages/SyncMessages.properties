# 오류 · 확인 · 알림 · 진행 · 안내 글. IDE 언어와 상관없이 항상 이 한국어 글이 나온다(SyncBundle.message 가 먼저 찾는다).
history.loading=히스토리를 읽는 중…
history.legend.dot=● 꽉 찬 점: 보통 커밋. 같은 칸의 곧은 선은 바로 아래 커밋에 이어집니다.
history.legend.merge.dot=○ 속이 빈 점 · 흐린 글자: 머지(Merge) 커밋입니다.
history.legend.split=위쪽에서 점으로 꺾여 들어오는 선: 이 커밋에서 새 가지가 갈라져 나갔거나, 위쪽 머지 커밋이 이 커밋을 머지해 갔습니다.
history.legend.merge=점에서 아래쪽으로 꺾여 나가는 선: 다른 가지의 커밋을 이 커밋으로 머지했습니다.
history.legend.passing=점 없이 곧게 지나가는 선: 이 줄과 상관없는 다른 가지가 아래 커밋으로 이어지는 길입니다.
history.legend.color=선 색은 나란히 가는 가지 줄을 구분할 뿐, 브랜치 종류와는 상관없습니다.
history.legend.hover=커밋을 고르면 오른쪽 칸에 그 커밋의 꺾인 선이 어느 커밋과 이어지는지 보입니다.
history.legend.mine=소스 꼬리표(「나」는 이 리포지토리의 git user.email · user.name, 내 다른 계정은 커밋 우클릭 「나로 보기」). 빨강 되돌림: 커밋 전 내용으로 되돌림. 주황 덮어씀: 머지하며(Merge) 그 수정을 버리고 다른 쪽 판을 택함. 보라 이어 고침: 그 판을 받아 위에서 고침. 「내 소스 …」는 다른 사람이 내 파일을, 「남의 소스 …」는 내가 남의 파일을 건드린 것.
