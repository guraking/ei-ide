rmerge.loading=두 브랜치를 받아 와 비교하는 중…
rmerge.up.to.date={0} 에 {1} 의 내용이 모두 들어 있습니다. 합칠 것이 없습니다.
rmerge.summary={0} 에서 커밋 {1,number,#}개가 들어오고 파일 {2,number,#}개가 바뀝니다.
rmerge.server=서버 {0}/
rmerge.unpushed=From 은 서버의 {0}/{1} 를 합칩니다. 내 PC 의 {1} 에만 있는 커밋 {2,number,#}개는 들어가지 않으니 먼저 Push 하세요.
rmerge.warn=주황 {0,number,#}개: 내가 고친 파일을 다른 사람이 고쳤습니다. 충돌 없이 합쳐질 수 있으니 확인하세요.
rmerge.hint=파일을 두 번 누르면 Into(왼쪽) ↔ From(오른쪽) 비교 창이 열립니다.
rmerge.hint.mine=내 파일: 개인 브랜치에서 바꾼 파일 · 고치는 중인 파일 · 최근 {0,number,#}일 안에 내 이름으로 커밋한 파일
rmerge.running={0} → {1} 합치는 중…
rmerge.diverged=서버의 ''{0}'' 와 내 PC 의 ''{0}'' 가 서로 다른 커밋을 갖고 있습니다. 먼저 받기(Pull)로 맞춘 뒤 다시 하세요.
rmerge.conflict={0} → {1} 합치기에서 충돌이 났습니다. 이어서 뜨는 충돌 창에서 해결하고 커밋한 뒤 푸시하세요.
rmerge.done={0} 을(를) {1} 에 합쳤습니다. 아직 푸시하지 않았습니다.
