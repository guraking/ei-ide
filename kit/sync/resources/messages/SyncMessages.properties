# 오류 · 확인 · 알림 · 진행 · 안내 글. IDE 언어와 상관없이 항상 이 한국어 글이 나온다(SyncBundle.message 가 먼저 찾는다).
history.loading=기록을 읽는 중…
history.legend.dot=● 꽉 찬 점: 보통 커밋. 같은 칸의 곧은 선은 바로 아래 커밋에 이어집니다.
history.legend.merge.dot=○ 속이 빈 점 · 흐린 글자: 합치기(Merge) 커밋입니다.
history.legend.split=위쪽에서 점으로 꺾여 들어오는 선: 이 커밋에서 새 가지가 갈라져 나갔거나, 위쪽 합치기 커밋이 이 커밋을 합쳐 갔습니다.
history.legend.merge=점에서 아래쪽으로 꺾여 나가는 선: 다른 가지의 커밋을 이 커밋으로 합쳤습니다.
history.legend.passing=점 없이 곧게 지나가는 선: 이 줄과 상관없는 다른 가지가 아래 커밋으로 이어지는 길입니다.
history.legend.color=선 색은 나란히 가는 가지 줄을 구분할 뿐, 브랜치 종류와는 상관없습니다.
history.legend.hover=커밋을 고르면 위쪽 줄에 그 커밋의 꺾인 선이 어느 커밋과 이어지는지 보입니다.
history.graph.straight=꺾인 선 없이 바로 아래 커밋에 곧게 이어진 보통 커밋입니다.
sync.revert.confirm=아래 파일의 내 변경을 지우고 마지막 커밋 상태로 되돌립니다. 되돌린 변경은 복구할 수 없습니다.
sync.revert.skipped=새로 추가 · 이름 바꿈 · 복사한 파일 {0,number,#}개는 지우지 않도록 뺐습니다. 그 파일은 「스테이징만 풀기」를 쓰세요.
sync.revert.done={0,number,#}개 파일을 되돌렸습니다.
sync.unstage.done={0,number,#}개 파일의 스테이징을 풀었습니다. 파일은 그대로 남아 있습니다.
sync.unassume.done={0,number,#}개 파일의 Assume Unchanged 를 풀었습니다. 내 변경이 다시 보입니다.
sync.svn.updating={0}: svn update 중…
sync.svn.updated={0}: {1,number,#}개 저장소를 최신으로 받았습니다.
sync.action.missing={0} 동작을 찾을 수 없습니다({1}).
sync.action.disabled={0}: 지금은 할 수 없습니다.
sync.action.disabled.resolve={0}: 지금은 할 수 없습니다 — git 에 충돌 상태인 파일이 없습니다. 받기 뒤 충돌이 나면 이 단추로 해결합니다.
sync.no.project=프로젝트 폴더를 알 수 없습니다.
sync.comparing=비교 중…
sync.fetching.tail=원격 변경을 받아 오는 중…
sync.select.repo=새로고침할 저장소를 트리에서 고르세요.
sync.repo.fetching={0} 원격 변경을 받아 오는 중…
sync.repo.checked.tail={0} 원격 확인 끝
sync.no.upstream=''{0}'' 브랜치에 원격 추적 브랜치가 없습니다. 먼저 올리기(Push)로 원격 브랜치를 연결하세요.
sync.stage.done={0,number,#}개 파일을 Staged 에 담았습니다.
sync.push.none=올릴 Git 저장소가 없습니다.
sync.undo.no.git=되돌릴 Git 저장소가 없습니다.
sync.undo.pick.repo=Git 저장소가 여러 개입니다. 되돌릴 저장소를 트리에서 먼저 고르세요.
sync.undo.in.progress={0}: 합치기 · 리베이스가 진행 중입니다. Git 메뉴의 Abort 로 먼저 끝내세요.
sync.undo.already={0}: 마지막 동작({1})은 방금 이 창에서 되돌린 것입니다. 되돌리기는 한 번만 합니다.
sync.undo.nothing={0}: 되돌릴 수 있는 동작이 없습니다(마지막 동작: {1}).
sync.undo.way.switch=앞 브랜치 {0} 로 다시 바꿉니다.
sync.undo.way.soft=커밋만 없애고, 그 커밋의 변경은 Staged 에 그대로 남깁니다.
sync.undo.way.keep=그 동작 전 위치로 브랜치를 되돌립니다. 아직 커밋하지 않은 내 변경은 지키고, 지킬 수 없으면 아무것도 바꾸지 않고 멈춥니다.
sync.undo.confirm={0} 저장소의 마지막 Git 동작:\n{1}\n\n{2}
sync.undo.pushed=이 커밋은 이미 원격에 올라가 있어 다음 받기(Pull) 때 다시 들어옵니다. 원격에서도 없애려면 IntelliJ Git 창 Log 탭의 Revert Commit 을 쓰세요.
sync.undo.done={0}: 「{1}」 을(를) 되돌렸습니다.
history.drop.head=현재 브랜치({0}) 줄에 놓아야 합치기 · 리베이스를 고를 수 있습니다.
history.branch.no.repo=이 프로젝트 폴더의 Git 저장소를 IDE 가 아직 모릅니다. 설정 → Version Control → Directory Mappings 를 확인하세요.
history.branch.missing=브랜치 {0} 을(를) 찾을 수 없습니다. Refresh 뒤 다시 해 보세요.
