sync.repo.checked.tail={0} 원격 확인 끝
sync.no.upstream=''{0}'' 브랜치에 원격 추적 브랜치가 없습니다. 먼저 올리기(Push)로 원격 브랜치를 연결하세요.
rmerge.detached=지금 브랜치가 없습니다(detached HEAD). 개인 브랜치로 옮긴 뒤 다시 하세요.
