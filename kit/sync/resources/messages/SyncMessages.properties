gitlogin.error.user=아이디에 「:」 · 탭 · 줄바꿈은 쓸 수 없습니다.
gitlogin.error.user.empty=아이디를 넣으세요.
gitlogin.error.secret=비밀번호 또는 토큰을 넣으세요.
gitlogin.error.save=Git 로그인을 저장하지 못했습니다: {0}
undo.in.progress=합치기 · 리베이스 · cherry-pick 이 진행 중이라 되돌리지 않습니다. 먼저 충돌을 해결해 마치거나 취소하세요.
undo.detached=지금 브랜치가 없습니다(detached HEAD). 브랜치로 옮긴 뒤 다시 하세요.
undo.nothing=''{0}'' 브랜치에 되돌릴 Git 동작이 없습니다.
undo.checkout.not.branch=앞 위치 ''{0}'' 은(는) 브랜치가 아니라 되돌리지 않습니다. 위쪽 브랜치 메뉴에서 직접 바꾸세요.
undo.confirm.last={0} 의 마지막 Git 동작: <b>{1}</b> ({2})
undo.confirm.soft=이 커밋을 없애고 그 앞 커밋 {0} 로 돌립니다. 바뀐 파일은 그대로 남아 고쳐서 다시 커밋할 수 있습니다.
undo.confirm.keep=이 동작 전 위치(커밋 {0})로 돌립니다. 커밋하지 않은 내 변경은 그대로 둡니다. 지킬 수 없으면 아무것도 바꾸지 않고 멈춥니다.
undo.confirm.checkout=앞 브랜치 {0} 로 다시 바꿉니다.
undo.confirm.server=없어질 커밋은 이미 서버에 있습니다. 서버에는 그대로 남아 다음 Pull 때 다시 들어옵니다.
undo.keep.failed=커밋하지 않은 내 변경과 겹쳐 되돌리지 않았습니다. 작업본은 그대로입니다. 그 파일을 커밋하거나 Shelve 한 뒤 다시 하세요.
undo.done={0}: 「{1}」 을(를) 되돌렸습니다. 한 번 더 하면 되돌리기 전으로 돌아갑니다.
sync.resolve.none=git 에 충돌 상태인 파일이 없습니다. 받기 뒤 충돌이 나면 켜집니다.
