more.tool.windows.step.header=툴 윈도우 더보기
more.tool.windows.step.text=더 많은 툴 윈도우 아이콘을 통해 더 많은 도구에 액세스할 수 있습니다.
newUiOnboarding.git.widget.step.text.no.repo=Git 리포지토리를 생성하거나 프로젝트를 공유합니다. 버전 컨트롤이 설정되면, 브랜치를 빠르게 전환하고, 새로운 브랜치를 만들거나 인기 있는 Git 액션을 사용할 수 있습니다.
tool.window.layouts.step.header=툴 윈도우 레이아웃
tool.window.layouts.step.text=툴 윈도우는 메인 창의 측면에 고정되어 있으며, 아이콘의 위치에 따라 수직, 수평 또는 분할 레이아웃 옵션을 사용할 수 있습니다.
tool.windows.names.step.header=툴 윈도우 이름
tool.windows.names.step.text=컨텍스트 메뉴의 옵션으로 툴 윈도우의 이름을 표시합니다.
