legal.notice.text=<b>중요\: JETBRAINS 디컴파일러에 접근해 사용하면 최종 사용자 라이선스 계약에 명시되고 아래에 인용된 조건에 동의하는 것입니다. 이 조건에 동의하지 않으면 JETBRAINS 디컴파일러에 접근하거나 사용하지 마세요.</b><br><br>이 소프트웨어에는 원본 바이너리 코드에서 소스 코드를 다시 만들어 내는 디컴파일 기능("JetBrains Decompiler")이 있습니다. 사용권자는 바이너리 코드와 소스 코드가 저작권법과 상표법의 보호를 받을 수 있음을 인정합니다. JetBrains 디컴파일러를 쓰기 전에 사용권자는 해당 라이선스 계약이 바이너리 코드 디컴파일을 금지하지 않는지(관련 법이 명시적으로 허용하는 범위는 제외) 또는 저작권자에게서 디컴파일 허락을 받았는지 확인해야 합니다.<br><br>JetBrains 디컴파일러 사용은 전적으로 선택 사항입니다. 사용권 제공자는 JetBrains 디컴파일러 사용을 권하거나 용인하지 않으며, 사용권자가 관련 법을 어기며 JetBrains 디컴파일러를 쓴 데 대한 책임을 지지 않습니다.
