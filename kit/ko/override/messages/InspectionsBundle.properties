inspection.help=지정한 프로젝트의 코드를 분석합니다. 자세한 내용은 매개변수 없이 실행해 보세요.
inspection.command.line.explanation=필요한 매개변수\: <project_file_path> <inspection_profile> <output_path> [<options>]\n<inspection_profile> – 프로젝트나 로컬에 설정된 프로필 이름 또는 코드 검사 프로필 경로.\n-e|-profileName|-profilePath 가운데 하나를 쓰면 생략할 수 있습니다\n쓸 수 있는 옵션\:\n-d <directory_path>  - 검사할 폴더, 기본값은 프로젝트 전체\n-e                   - 프로젝트에 지정된 코드 검사 프로필 사용\n-v[0|1|2]            - 출력 수준\: 0 - 조용히, 1 - 자세히, 2 - 가장 자세히\n-profileName         - 프로젝트에 정의된 프로필 이름\n-profilePath         - 프로필 파일의 절대 경로\n-format              - 보고서 출력 형식. xml|json|plain 가운데 하나, 기본값은 xml\n-changes             - 커밋하지 않은 변경을 검사해 새 문제를 보고
