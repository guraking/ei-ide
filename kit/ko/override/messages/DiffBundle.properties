dirdiff.filter.help.description=<p>파일을 넣으려면 맞는 패턴을 입력하세요.</p><p>파일을 빼려면 패턴 앞에 <code>\!</code> 를 붙이세요.</p><p>여러 필터를 <code>\\&</code> 와 <code>|</code> 로 이으면 각각 <code>AND<code/> · <code>OR<code/> 로 묶입니다. </p><p><b>예\:</b></p><ul><li><code>*.txt</code> 는 .txt 로 끝나는 모든 경로를 넣습니다.</li><li><code>\!build/*</code> 는 <code>build</code> 폴더 안의 모든 파일을 뺍니다.</li><li><code>*.txt\\&\!build/*</code> 는 <code>.txt</code> 로 끝나면서 <code>build</code> 폴더 안에 없는 모든 경로를 넣습니다.</li></ul>
