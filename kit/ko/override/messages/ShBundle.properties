quote.the.parameter.to.name.so.the.shell.won.t.interpret.it='-name'에 대한 파라미터를 셸이 해석하지 않도록 따옴표로 묶으세요.
remove.for.numeric.index.or.escape.it.for.string=숫자 인덱스의 경우 '$' 및 '${}'를 제거하거나 문자열의 경우 이를 이스케이프하세요.
sh.livetemplate.description.array.at.index=인덱스의 요소
