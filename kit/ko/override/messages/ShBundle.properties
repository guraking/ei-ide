the.arguments.to.this.comparison.can.never.be.equal.make.sure.your.syntax.is.correct=이 비교의 아규먼트는 절대 동일하면 안 됩니다. 구문이 올바른지 확인하세요.
the.dot.command.does.not.support.arguments.in.sh.dash.set.them.as.variables=dot 명령어는 sh/dash의 아규먼트를 지원하지 않습니다. 해당 아규먼트를 변수로 설정하세요.
this.cp.has.no.destination.check.the.arguments=이 'cp'에는 대상이 없습니다. 아규먼트를 확인하세요.
this.format.string.has.2.variables.but.is.passed.1.arguments=이 형식 문자열에는 2개의 변수가 있지만 1개의 아규먼트가 전달됩니다.
this.ln.has.no.destination.check.the.arguments.or.specify.explicitly=이 'ln'에는 대상이 없습니다. 아규먼트를 확인하거나 '.'를 명시적으로 지정하세요.
this.mv.has.no.destination.check.the.arguments=이 'mv'에는 대상이 없습니다. 아규먼트를 확인하세요.
this.printf.format.string.has.no.variables.other.arguments.are.ignored=이 printf 형식 문자열에는 변수가 없습니다. 다른 아규먼트는 무시됩니다.
use.foo.if.function.s.1.should.mean.script.s.1=함수의 '$1' 아규먼트가 스크립트의 '$1' 아규먼트를 의미하는 경우 'foo "$@"'을 사용하세요.
use.or.quote.arguments.to.v.to.avoid.glob.expansion=`[[ ]]`를 사용하거나 '-v' 옵션의 아규먼트를 따옴표로 묶어서 glob 확장을 방지하세요.
