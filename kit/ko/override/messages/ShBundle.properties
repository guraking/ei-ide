the.here.is.literal.to.assign.by.index.use.index.value.with.no.spaces.to.keep.as.literal.quote.it=여기에서 상등 문자 '\='는 리터럴입니다. 인덱스로 대입하려면 ([index]\=value)을 사용하세요. 리터럴로 유지하려면 따옴표로 묶으세요.
this.nested.loop.overrides.the.index.variable.of.its.parent=이 중첩 루프는 해당 상위 항목의 인덱스 변수를 오버라이드합니다.
this.parent.loop.has.its.index.variable.overridden=이 상위 루프에서 해당 인덱스 변수가 오버라이드되어 있습니다.
this.pattern.always.overrides.a.later.one=이 패턴은 항상 이후 패턴을 오버라이드합니다.
argument.mixes.string.and.array.use.or.separate.argument=아규먼트에 문자열과 배열이 혼재되어 있습니다. '*' 또는 별도의 아규먼트를 사용하세요.
argument.to.implicit.n.is.always.true.due.to.literal.strings=묵시적 '-n'에 대한 아규먼트는 리터럴 문자열로 인해 항상 true입니다.
check.1039.remove.indentation.before.end.token.or.use.and.indent.with.tabs=종료 토큰 앞의 인덴트를 제거하세요(또는'<<-'를 사용하고 탭으로 인덴트).
check.1040.when.using.you.can.only.indent.with.tabs=<<- 사용 시 탭으로만 인덴트하세요.
check.1086.don.t.use.on.the.iterator.name.in.for.loops=for 루프 내 이터레이터 이름에 '$'를 사용하면 안 됩니다.
check.1116.missing.on.a.expression.or.use.for.arrays='$((..))' 표현식에 '$'가 누락되었나요? 배열인 경우, '( ('를 사용하세요.
foo.references.arguments.but.none.are.ever.passed='foo'는 아규먼트를 참조하지만 아무것도 전달되지 않습니다.
n.doesn.t.work.with.unquoted.arguments.quote.or.use=''-n''은 따옴표로 묶이지 않은 아규먼트와 함께 작동하지 않습니다. 따옴표로 묶거나 ''''[[ ]]''''를 사용하세요.
quote.arguments.to.unset.so.they.re.not.glob.expanded=glob 구문을 무시하려면 아규먼트를 따옴표표 묶으세요.
