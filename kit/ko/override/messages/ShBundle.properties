aliases.can.t.use.positional.parameters.use.a.function=별칭은 위치 파라미터를 사용할 수 없습니다. 함수를 사용하세요.
check.1065.trying.to.declare.parameters.don.t.use.and.refer.to.params.as.1.2=파라미터를 선언하면  안 됩니다. ()를 사용하고 $1, $2 등으로 파라미터를 참조하세요.
elements.in.associative.arrays.need.index.e.g.array.index.value=연관 배열의 요소에는 인덱스가 필요합니다(예\: array\=( [index]\=value ).
