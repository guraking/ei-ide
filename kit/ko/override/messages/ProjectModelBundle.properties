libraries.node.text.ide=라이브러리에는 애플리케이션에 여러 기능을 더해 주는 클래스가 들어 있습니다. 프로젝트 개발에 도움이 되는 소스 파일과 JavaDoc도 함께 들어 있습니다.<br><br>IntelliJ IDEA는 라이브러리를 써서 자동 완성, 유효성 검사, 오류 강조 등을 돕습니다.<br><br>전역 라이브러리는 프로젝트 전체에서 참조되며 모든 모듈에서 쓸 수 있습니다. 이 컴퓨터에서 만든 모든 프로젝트에서도 쓸 수 있습니다.<br><br>다만 전역 라이브러리는 프로젝트를 공유받는 사람에게는 전달되지 않습니다. 팀과 프로젝트를 공유한다면 프로젝트 라이브러리를 쓰세요.<br><br>노드를 펼치고 하위 항목을 골라 전역 라이브러리를 관리하세요. <br><br>모듈에 라이브러리를 붙이려면 그 모듈을 선택하고 '의존성' 탭에서 '추가'를 눌러 라이브러리 위치를 지정하세요.
