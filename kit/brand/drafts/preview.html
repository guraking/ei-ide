<!doctype html><meta charset="utf-8"><title>EI IDE 로고 시안</title>
<style>
body{margin:0;padding:24px;background:#e9ebef;font:14px "Malgun Gothic",sans-serif;color:#222}
section{background:#fff;border-radius:10px;padding:16px 20px;margin-bottom:20px}
h2{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.dark{background:#2b2d30;padding:8px;border-radius:6px}
figure{margin:0;text-align:center} figcaption{font-size:12px;color:#666;margin-top:4px}
.splash{display:block;margin-top:14px;max-width:100%;height:auto}
</style>
<body>
<script>
const CONCEPTS = [["a-eclipse", "A · 일식 고리"], ["b-caret", "B · 커서 캐럿"], ["c-hex", "C · 육각 블록"]];
function fig(dir, src, px, dark) {
  return '<figure><div class="' + (dark ? 'dark' : '') + '"><img src="' + dir + '/' + src + '" width="' + px + '" height="' + px + '"></div>'
       + '<figcaption>' + src + ' ' + px + 'px' + (dark ? ' 어두운 바탕' : '') + '</figcaption></figure>';
}
for (const [dir, title] of CONCEPTS) {
  const s = document.createElement('section');
  s.innerHTML = '<h2>' + title + '</h2><div class="row">'
    + fig(dir, 'icon_16.svg', 16) + fig(dir, 'icon_16.svg', 16, true) + fig(dir, 'icon_16.svg', 32)
    + fig(dir, 'icon.svg', 32) + fig(dir, 'icon.svg', 128) + fig(dir, 'icon.svg', 256)
    + '</div><img class="splash" src="' + dir + '/splash.svg" width="640" height="400">';
  document.body.append(s);
}
</script>
</body>
