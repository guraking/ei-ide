# 웹 언어 서버에 쓰는 Node.js 판. IDE 안 「Node.js 받기」(WebTools.nodeVersion)와 설치본 대본(kit/web/apply_web.py)이 함께 읽는다.
# 언어 서버 판은 같은 폴더의 package.json · package-lock.json 에 고정한다(둘 다 npm ci 로 설치).
# typescript 는 7 부터 Go 로 옮겨 가 tsserver.js 와 JS API 가 없으므로 5 판에 둔다.
# 판을 올릴 때: node.version 과 node.sha256.win-x64(nodejs.org/dist/<판>/SHASUMS256.txt)를 함께 바꾸고,
# 언어 서버는 package.json 을 고친 뒤 이 폴더에서 npm install --package-lock-only 로 잠금 파일을 다시 만든다.
node.version=v24.22.2
