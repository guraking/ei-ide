# 파일 종류 아이콘(FileIcons). 키는 파일 이름 패턴, 위에서부터 처음 맞는 것을 쓴다.
# MyBatis 매퍼 XML 은 글을 봐야 알 수 있어 ei-db 의 MapperFileIcon 이 따로 단다.
application*.yml=/icons/ei/fileSpringConfig.svg
application*.yaml=/icons/ei/fileSpringConfig.svg
